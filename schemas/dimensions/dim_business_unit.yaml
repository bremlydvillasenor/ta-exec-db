dataset: dim_business_unit
layer: dimension
version: 1.0
purpose: >
  Conformed Business Unit dimension. It is the Business Unit slicer for the
  Executive Summary and applies to both delivery (THD-based) and quality
  (start-cohort-based) visuals.

grain: One row per Business Unit.

primary_key: [business_unit_key]
unique_keys:
  - [business_unit_code]

source: Requisition source system (organisation attributes on the requisition).

columns:
  - name: business_unit_key
    type: integer
    nullable: false
    description: Surrogate key.
  - name: business_unit_code
    type: string
    nullable: false
    description: Stable natural code from the source (e.g. "ENG").
  - name: business_unit_name
    type: string
    nullable: false
    description: Display name (e.g. "Engineering").
  - name: sort_order
    type: integer
    nullable: false
    description: Presentation order for slicers and legends.
  - name: is_active
    type: boolean
    nullable: false
    description: false for retired units kept only for history.

relationships:
  - {to: fct_requisition, columns: {business_unit_key: business_unit_key}, cardinality: one_to_many, active: true}
  - {to: fct_application, columns: {business_unit_key: business_unit_key}, cardinality: one_to_many, active: true}
  - {to: fct_application_stage_event, columns: {business_unit_key: business_unit_key}, cardinality: one_to_many, active: true}
  - {to: fct_hire_outcome, columns: {business_unit_key: business_unit_key}, cardinality: one_to_many, active: true}
  - {to: mart_exec_demand, columns: {business_unit_key: business_unit_key}, cardinality: one_to_many, active: true}
  - {to: mart_exec_risk, columns: {business_unit_key: business_unit_key}, cardinality: one_to_many, active: true}
  - {to: mart_exec_pipeline, columns: {business_unit_key: business_unit_key}, cardinality: one_to_many, active: true}
  - {to: mart_exec_quality, columns: {business_unit_key: business_unit_key}, cardinality: one_to_many, active: true}
  - {to: mart_stage_yield, columns: {business_unit_key: business_unit_key}, cardinality: one_to_many, active: true}

business_rules:
  - Business Unit is a requisition attribute. Applications, stage events and hires inherit it from their requisition so the same key filters every fact and mart.
  - Include an "Unknown" member (key -1) so facts never have a null business_unit_key.

data_quality_tests:
  - {test: unique, columns: [business_unit_key]}
  - {test: unique, columns: [business_unit_code]}
  - {test: not_null, columns: [business_unit_key, business_unit_code, business_unit_name]}
  - {test: referential_integrity, description: Every business_unit_key in facts and marts exists here.}

power_bi:
  hide_columns: [business_unit_key]
  sort_by: {business_unit_name: sort_order}
  slicer_column: business_unit_name
  notes: Single-direction filter from this dimension to every fact and mart. Do not enable bidirectional filtering.
