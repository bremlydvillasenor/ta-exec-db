  - metric_id: EXEC-14
    name: Speed vs 60-Day Early Attrition
    business_question: When hiring becomes faster or slower, does early-tenure quality appear to move with it?
    description: Dual-axis trend of median Time to Fill and 60-Day Early Attrition for the same fully matured monthly start cohorts.
    formula: |
      Per cohort month:
        Speed   = MEDIAN(time_to_fill_days) over matured hires in the cohort
        Quality = SUM(early_attrition_60d_count) / SUM(matured_hires_60d) for the same hires
    numerator: see EXEC-13 for Quality
    denominator: see EXEC-13 for Quality
    aggregation: median (speed) and ratio_of_sums (quality), both by cohort month
    date_basis: employee start cohort month
    population: Fully matured start cohorts; window = latest 12 (kpi_cohort_window = latest_12).
    filters: [business_unit, job_family, job_level]
    exclusions: [immature cohorts, THD slicer, THD-based accepted offers that have not started]
    target: null
    format: left axis days (integer), right axis percent (1 decimal), n label per point
    source_dataset: fct_hire_outcome (speed) and mart_exec_quality (quality), both via dim_start_cohort
    required_columns: [time_to_fill_days, is_fully_matured_start_month, cohort_month_key, early_attrition_60d_count, matured_hires_60d]
    power_bi_measure_guidance: |
      Median Time to Fill (Start Cohort) = CALCULATE(MEDIAN(fct_hire_outcome[time_to_fill_days]), fct_hire_outcome[is_fully_matured_start_month] = TRUE)
      Right axis = [60-Day Early Attrition]; x-axis = dim_start_cohort[cohort_month_label]; visual filter kpi_cohort_window = "latest_12".
      Data label or tooltip = [Matured Hires 60d]; apply [Is Low Volume Cohort] for flagging.
    validation_rules:
      - Both lines use the same hires (fct_hire_outcome rows of the cohort).
      - Exactly 12 points when the cohort filter is applied.
      - The chart states association only; no causal wording.
    notes: Median Time to Fill here is re-cohorted by start month and will differ from EXEC-05, which is THD-based.
